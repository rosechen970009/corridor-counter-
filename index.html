```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corridor Test Counter</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#eefdff;margin:0;padding:14px;color:#173b3f}
.wrap{max-width:700px;margin:auto}
h1{text-align:center;color:#00796b}
.panel{background:white;border-radius:20px;padding:14px;box-shadow:0 6px 18px #0002}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input{width:100%;font-size:18px;padding:12px;border-radius:12px;border:1px solid #ccc}
label{font-weight:bold}
.status{text-align:center;font-size:22px;font-weight:bold;background:#e2f6f4;border-radius:14px;padding:12px;margin:12px 0}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{text-align:center;background:#f8fbfb;border-radius:16px;padding:10px}
.num{font-size:42px;font-weight:900}
.contra{color:#1565c0}.ipsi{color:#d32f2f}.total{color:#00796b}
.percent{text-align:center;background:#f3fffd;border-radius:16px;margin:10px 0;padding:14px}
.percent .big{font-size:40px;font-weight:900;color:#00796b}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
button{border:0;border-radius:22px;color:white;font-weight:900;font-size:26px;min-height:135px;touch-action:manipulation}
#contraBtn{background:#1976d2}
#ipsiBtn{background:#d32f2f}
.small{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.small button{font-size:18px;min-height:54px}
#undoBtn{background:#fb8c00}#saveBtn{background:#00897b}#exportBtn{background:#455a64}#resetBtn{background:#666}
.done{background:#dff7e8;color:#087b31}
table{width:100%;border-collapse:collapse;margin-top:10px;background:white}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:center}
th{background:#d8f3ee}
.note{font-size:14px;margin-top:10px;color:#555}
</style>
</head>

<body>
<div class="wrap">
<h1>Corridor Test 計數器</h1>

<div class="panel">
<div class="grid">
<div>
<label>小鼠編號</label>
<input id="mouseId" placeholder="M01">
</div>
<div>
<label>總上限</label>
<input id="limit" type="number" value="20" min="1">
</div>
</div>

<label>Trial / 備註</label>
<input id="trial" placeholder="Day 14 / pre-test">

<div id="status" class="status">進行中：0 / 20</div>

<div class="cards">
<div class="card">
<div><b>Contra</b><br><small>左側</small></div>
<div id="contraCount" class="num contra">0</div>
</div>
<div class="card">
<div><b>Ipsi</b><br><small>右側</small></div>
<div id="ipsiCount" class="num ipsi">0</div>
</div>
<div class="card">
<div><b>Total</b></div>
<div id="totalCount" class="num total">0</div>
</div>
</div>

<div class="percent">
<div><b>Contralateral % = Contra / Total × 100</b></div>
<div id="contraPercent" class="big">0.0%</div>
</div>

<div class="btns">
<button id="contraBtn">CONTRA<br><span style="font-size:20px">左側</span></button>
<button id="ipsiBtn">IPSI<br><span style="font-size:20px">右側</span></button>
</div>

<div class="small">
<button id="undoBtn">復原</button>
<button id="saveBtn">儲存這筆</button>
<button id="exportBtn">匯出 CSV</button>
<button id="resetBtn">全部重設</button>
</div>

<div class="note">
右側 = Ipsi；左側 = Contra。達到上限後只會停止計數，不會發出聲音。
</div>

<table>
<thead>
<tr>
<th>時間</th><th>小鼠</th><th>Trial</th><th>Contra</th><th>Ipsi</th><th>Total</th><th>Contra %</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>
</div>

<script>
let contra = 0;
let ipsi = 0;
let history = [];
let rows = [];

const $ = id => document.getElementById(id);

function getLimit(){
  return Math.max(1, parseInt($('limit').value || 20));
}

function total(){
  return contra + ipsi;
}

function percent(){
  return total() ? contra / total() * 100 : 0;
}

function isDone(){
  return total() >= getLimit();
}

function update(){
  $('contraCount').textContent = contra;
  $('ipsiCount').textContent = ipsi;
  $('totalCount').textContent = total();
  $('contraPercent').textContent = percent().toFixed(1) + '%';

  if(isDone()){
    $('status').textContent = '✅ Completed：' + total() + ' / ' + getLimit();
    $('status').className = 'status done';
  }else{
    $('status').textContent = '進行中：' + total() + ' / ' + getLimit();
    $('status').className = 'status';
  }
}

function add(side){
  if(isDone()) return;

  history.push(side);

  if(side === 'contra'){
    contra++;
  }else{
    ipsi++;
  }

  update();
}

function undo(){
  const last = history.pop();
  if(!last) return;

  if(last === 'contra'){
    contra--;
  }else{
    ipsi--;
  }

  update();
}

function resetCounts(){
  contra = 0;
  ipsi = 0;
  history = [];
  update();
}

function saveRow(){
  const row = {
    time: new Date().toLocaleString(),
    mouse: $('mouseId').value || '',
    trial: $('trial').value || '',
    contra: contra,
    ipsi: ipsi,
    total: total(),
    percent: percent().toFixed(1)
  };

  rows.push(row);
  renderRows();
  resetCounts();
}

function renderRows(){
  $('records').innerHTML = rows.map(r =>
    `<tr>
      <td>${r.time}</td>
      <td>${r.mouse}</td>
      <td>${r.trial}</td>
      <td>${r.contra}</td>
      <td>${r.ipsi}</td>
      <td>${r.total}</td>
      <td>${r.percent}</td>
    </tr>`
  ).join('');
}

function exportCSV(){
  const header = ['Time','Mouse','Trial','Contralateral','Ipsilateral','Total','Contralateral_percent'];
  const data = rows.map(r => [r.time,r.mouse,r.trial,r.contra,r.ipsi,r.total,r.percent]);
  const csv = [header, ...data]
    .map(row => row.map(x => `"${String(x).replaceAll('"','""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'corridor_test_results.csv';
  a.click();
  URL.revokeObjectURL(url);
}

$('contraBtn').onclick = () => add('contra');
$('ipsiBtn').onclick = () => add('ipsi');
$('undoBtn').onclick = undo;
$('resetBtn').onclick = resetCounts;
$('saveBtn').onclick = saveRow;
$('exportBtn').onclick = exportCSV;
$('limit').onchange = update;

document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if(key === 'a') add('contra');
  if(key === 'l') add('ipsi');
  if(key === 'z') undo();
});

update();
</script>
</body>
</html>
```
